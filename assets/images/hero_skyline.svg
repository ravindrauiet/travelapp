    <rect x="358" y="128" width="6" height="8" rx="3"/>
    <rect x="372" y="128" width="6" height="8" rx="3"/>
    <rect x="386" y="128" width="6" height="8" rx="3"/>
    <rect x="400" y="128" width="6" height="8" rx="3"/>
  </g>

  <!-- Trees -->
  <g fill="#1E1B4B">
    <ellipse cx="92" cy="146" rx="16" ry="10"/>
    <ellipse cx="108" cy="148" rx="12" ry="8"/>
    <ellipse cx="214" cy="148" rx="12" ry="8"/>
    <ellipse cx="322" cy="148" rx="14" ry="8"/>
  </g>

  <!-- Elevated metro viaduct -->
  <rect x="0" y="166" width="420" height="7" fill="#C7D2FE" opacity="0.9"/>
  <g fill="#A5B4FC" opacity="0.65">
    <rect x="30" y="173" width="10" height="27"/>
    <rect x="130" y="173" width="10" height="27"/>
    <rect x="230" y="173" width="10" height="27"/>
    <rect x="330" y="173" width="10" height="27"/>
  </g>
  <rect x="0" y="152" width="420" height="14" fill="#1E1B4B"/>

  <!-- Metro train -->
  <g>
    <path d="M196 148 H372 Q394 148 402 160 L404 164 H196 Z" fill="url(#train)"/>
    <rect x="196" y="148" width="208" height="16" fill="none"/>
    <rect x="196" y="157" width="206" height="3" fill="#FF6B35"/>
    <g fill="#312E81">
      <rect x="204" y="151" width="14" height="5" rx="1.5"/>
      <rect x="224" y="151" width="14" height="5" rx="1.5"/>
      <rect x="250" y="151" width="14" height="5" rx="1.5"/>
      <rect x="270" y="151" width="14" height="5" rx="1.5"/>
      <rect x="296" y="151" width="14" height="5" rx="1.5"/>
      <rect x="316" y="151" width="14" height="5" rx="1.5"/>
      <rect x="342" y="151" width="14" height="5" rx="1.5"/>
      <path d="M372 151 H386 L392 157 H372 Z"/>
