    <circle cx="398" cy="161" r="1.6" fill="#FDE68A"/>
    <rect x="242" y="149" width="1.5" height="15" fill="#A5B4FC"/>
    <rect x="288" y="149" width="1.5" height="15" fill="#A5B4FC"/>
    <rect x="334" y="149" width="1.5" height="15" fill="#A5B4FC"/>
  </g>
  <!-- Speed lines -->
  <g fill="#FFFFFF" opacity="0.5">
    <rect x="150" y="152" width="36" height="1.5" rx="0.75"/>
    <rect x="164" y="158" width="26" height="1.5" rx="0.75"/>
  </g>
