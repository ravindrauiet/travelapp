  <path d="M162 152 C159 146 160 140 162 136 C164 140 165 146 162 152 Z" fill="#FFB547"/>
  <rect x="134" y="90" width="4" height="56" fill="#FFFFFF" opacity="0.08"/>
  <rect x="186" y="90" width="4" height="56" fill="#FFFFFF" opacity="0.08"/>

  <!-- Red Fort style chhatris -->
  <g fill="url(#near)">
    <rect x="336" y="118" width="84" height="34"/>
    <rect x="346" y="104" width="14" height="14"/>
    <path d="M344 104 A9 9 0 0 1 362 104 Z"/>
    <rect x="392" y="104" width="14" height="14"/>
    <path d="M390 104 A9 9 0 0 1 408 104 Z"/>
    <rect x="368" y="96" width="18" height="22"/>
    <path d="M366 96 A11 11 0 0 1 388 96 Z"/>
